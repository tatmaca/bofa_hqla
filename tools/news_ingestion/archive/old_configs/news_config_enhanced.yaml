user_agent: "JL-NewsCrawler/0.1 (+contact: you@example.com)"
concurrency: 12  # Increased from 8
rss_max_workers: 6  # Increased from 4
per_host_rps: 1.0  # Increased from 0.5 (1 request/second is still polite)
timeout_s: 20  # Increased from 15
dedupe_horizon_days: 1

# <-- NEW -->
window_hours: 72  # Increased to catch weekend news (3 days)
timezone: "America/Chicago"
strict_24h: false  # Changed to false - collect articles even without dates (we can filter later)

# OpenAI API key for LLM bucketing and analysis (optional, can also use env var OPENAI_API_KEY)
openai_api_key: null

# Domains where we only keep metadata (title/url/published_at); no full-text fetch
# (prevents paywall scraping, keeps items usable for LLM rationales)
metadata_only_domains:
  - www.ft.com
  - www.bloomberg.com
  - www.wsj.com
  - www.nytimes.com
  - www.economist.com
  - www.barrons.com
  - www.financialtimes.com

# Domains to skip entirely (optional; start empty)
skip_domains:
  # Removed marketwatch.com - can collect metadata at least

# Enhanced RSS feeds - added more sources
rss_feeds:
  # Reuters (multiple feeds)
  - https://www.reuters.com/finance/markets/us/rss
  - https://www.reuters.com/world/us/rss
  - https://www.reuters.com/business/rss
  - https://www.reuters.com/markets/rss
  
  # AP News
  - https://apnews.com/hub/ap-top-news?rss=1
  - https://apnews.com/hub/business?rss=1
  - https://apnews.com/hub/financial-markets?rss=1
  
  # Financial Times
  - https://www.ft.com/?format=rss  # may hit paywall; titles still useful
  - https://www.ft.com/markets?format=rss
  
  # CNBC
  - https://www.cnbc.com/id/100003114/device/rss/rss.html  # Top News
  - https://www.cnbc.com/id/15839135/device/rss/rss.html  # Markets
  
  # Bloomberg (metadata only)
  - https://www.bloomberg.com/feeds/bloomberg.rss
  
  # Yahoo Finance
  - https://finance.yahoo.com/news/rssindex
  
  # MarketWatch (if not paywalled)
  - https://www.marketwatch.com/rss/topstories
  
  # Financial news aggregators
  - https://feeds.feedburner.com/zerohedge/feed  # Zero Hedge
  - https://www.investing.com/rss/news.rss  # Investing.com

# Enhanced front pages - added more sources
front_pages:
  - https://www.reuters.com/markets/us/
  - https://www.reuters.com/business/
  - https://www.cnbc.com/markets/
  - https://www.cnbc.com/business/
  - https://www.bloomberg.com/markets  # paywalled: metadata-only
  - https://finance.yahoo.com/
  - https://www.marketwatch.com/
  - https://www.investing.com/news/

# Enhanced sitemaps - added more sources
sitemaps:
  - https://www.reuters.com/sitemap_news_index.xml
  - https://apnews.com/sitemap.xml
  - https://www.cnbc.com/sitemap.xml
  - https://finance.yahoo.com/sitemap.xml

# Increased limits for more articles
max_links_per_front: 300  # Increased from 200
max_urls_per_sitemap: 1000  # Increased from 500

