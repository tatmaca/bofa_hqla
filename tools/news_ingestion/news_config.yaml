# ============================================================================
# Linear Online Learning Model (ONYL) - Cold-Start Coefficients
# ============================================================================
# Expert priors for linear model: B_k,f in bps per +1 unit factor
# Format: {factor_name: {tenor: bps_value}}
# Tenors: 3M, 2Y, 5Y, 10Y, 30Y
# These are starting guesses that get updated daily via online learning
# ============================================================================

linear_model_cold_start:
  # Hyperparameters
  learning_rate: 0.05  # η: how fast to learn
  forgetting_factor: 0.98  # λ: slowly forget old errors
  max_daily_coef_change: 0.8  # ΔB_max: max change in bps/(unit factor) per day
  smoothing_gamma: 0.2  # γ: smoothing across maturities
  
  # 1) Monetary Policy & Communication
  FED_TONE:  # Hawkish↔dovish pressers/speeches
    3M: 8
    2Y: 10
    5Y: 7
    10Y: 5
    30Y: 3
  
  FED_PATH_SURPRISE:  # Dots/forward guidance surprise
    3M: 4
    2Y: 8
    5Y: 7
    10Y: 6
    30Y: 5
  
  POLICY_RATE_SURPRISE:  # Target change vs pricing (rare outside FOMC)
    3M: 12
    2Y: 9
    5Y: 3
    10Y: 1
    30Y: 0
  
  BAL_SHEET_QT_QE:  # QT/QE emphasis, RRP/IOER tweaks (QT positive → higher yields)
    3M: 0
    2Y: 2
    5Y: 4
    10Y: 5
    30Y: 5
  
  # 2) Inflation & Growth Data (surprises vs consensus)
  CPI_CORE_SURP:  # Per +1 standardized surprise
    3M: 5
    2Y: 8
    5Y: 8
    10Y: 7
    30Y: 6
  
  CPI_HEAD_SURP:
    3M: 4
    2Y: 7
    5Y: 7
    10Y: 6
    30Y: 5
  
  PCE_CORE_SURP:
    3M: 4
