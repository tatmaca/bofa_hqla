# Sign guards: Economic constraints (factors that must have certain signs)
# Format: {factor_name: {min: value, max: value}} or {factor_name: "non_negative" | "non_positive"}
linear_model_sign_guards:
  # Inflation/growth/supply/term-premium factors should be ≥ 0
  CPI_CORE_SURP: "non_negative"
  CPI_HEAD_SURP: "non_negative"
  PCE_CORE_SURP: "non_negative"
  NFP_SURP: "non_negative"
  WAGE_SURP: "non_negative"
  ISM_SURP: "non_negative"
  RETAIL_SALES_SURP: "non_negative"
  GDP_SURP: "non_negative"
  PRODUCTIVITY_SURP: "non_negative"
  INFL_EXP_SURP: "non_negative"
  SUPPLY_LONG: "non_negative"
  SUPPLY_BILLS: "non_negative"
  FISCAL_DEFICIT_NEWS: "non_negative"
  TERM_PREMIUM_NEWS: "non_negative"
  # Risk-off should be ≤ 0
  RISK_OFF: "non_positive"
  # Oil down should be ≤ 0
  OIL_SHOCK_DOWN: "non_positive"
  # Funding stress: front-end > 0, long end ≤ 0
  FUNDING_STRESS:
    3M: {min: 0}
    2Y: {min: 0}
    5Y: {max: 0}
    10Y: {max: 0}
    30Y: {max: 0}

# ============================================================================
# Yield Movement Thresholds
# ============================================================================
# Configuration for filtering significant yield curve movements
# Only significant moves (>threshold_std standard deviations) are used for:
# - Model training (linear and XGBoost)
# - Monitoring/alerts
# - Analysis focus
# ============================================================================

yield_movement_thresholds:
  # Statistical threshold: number of standard deviations from mean
  threshold_std: 2.0  # Default: 2.0σ (captures ~95% of significant moves)
  
  # Absolute fallback threshold (bps) - used when insufficient historical data
  absolute_threshold_bps: 5.0  # 5 bps default
  
  # Rolling window for statistics calculation
  rolling_window_days: 60  # 60 days rolling window
  
  # Minimum samples required for valid statistics
  min_samples: 20  # Need at least 20 days of data
  
  # Enable significance filtering for training
  filter_training: true  # Only train on significant moves
  
  # Minimum number of significant tenors required to train
  min_significant_tenors: 1  # At least 1 tenor must have significant move

